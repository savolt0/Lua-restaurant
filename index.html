<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lúa Restaurant</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:white;}

.navbar{background:#111;}

.hero{
height:100vh;
background:url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5') center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero-overlay{
background:rgba(0,0,0,.6);
padding:40px;
border-radius:12px;
}

h1{font-size:60px;font-weight:bold;}

.section{padding:70px 20px;}

.card{
background:#1c1c1c;
border:none;
color:white;
transition:.3s;
}

.card:hover{transform:translateY(-5px);}

.gallery img{
width:100%;
border-radius:10px;
margin-bottom:15px;
}

footer{
background:#000;
text-align:center;
padding:20px;
}

.lang-btn{
position:fixed;
top:15px;
right:15px;
z-index:999;
}
</style>
</head>

<body>

<!-- NYELVVÁLTÓ -->
<div class="lang-btn">
<button class="btn btn-warning btn-sm" onclick="setLang('hu')">HU</button>
<button class="btn btn-light btn-sm" onclick="setLang('en')">EN</button>
</div>

<!-- HERO -->
<div class="hero">
<div class="hero-overlay">
<h1 data-hu="LÚA RESTAURANT" data-en="LÚA RESTAURANT">LÚA RESTAURANT</h1>
<p data-hu="Autentikus vietnámi étterem Budapesten" data-en="Authentic Vietnamese Restaurant in Budapest">
Autentikus vietnámi étterem Budapesten
</p>
<a href="#menu" class="btn btn-warning mt-3" data-hu="Menü" data-en="Menu">Menü</a>
</div>
</div>

<!-- ABOUT -->
<div class="section text-center">
<h2 data-hu="Rólunk" data-en="About Us">Rólunk</h2>
<p data-hu="Friss alapanyagokból készült autentikus vietnámi ételek." 
data-en="Authentic Vietnamese dishes made from fresh ingredients.">
Friss alapanyagokból készült autentikus vietnámi ételek.
</p>
</div>

<!-- MENU -->
<div id="menu" class="section bg-dark">
<div class="container text-center">

<h2 data-hu="Étlap" data-en="Menu">Étlap</h2>

<div class="row mt-4">

<div class="col-md-4">
<div class="card p-3">
<h5>Pho Bo</h5>
<p>3500 Ft</p>
</div>
</div>

<div class="col-md-4">
<div class="card p-3">
<h5>Pho Ga</h5>
<p>3200 Ft</p>
</div>
</div>

<div class="col-md-4">
<div class="card p-3">
<h5>Spring Rolls</h5>
<p>2500 Ft</p>
</div>
</div>

</div>
</div>
</div>

<!-- GALLERY -->
<div class="section text-center">
<h2 data-hu="Galéria" data-en="Gallery">Galéria</h2>

<div class="container gallery mt-4">
<div class="row">

<div class="col-md-4">
<img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c">
</div>

<div class="col-md-4">
<img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
</div>

<div class="col-md-4">
<img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5">
</div>

</div>
</div>
</div>

<!-- CONTACT -->
<div class="section bg-dark text-center">
<h2 data-hu="Kapcsolat" data-en="Contact">Kapcsolat</h2>

<p>📍 Soroksári út 46, Budapest</p>
<p>📞 +36 70 783 6379</p>

<div class="container mt-3">
<iframe 
width="100%" height="300"
style="border-radius:10px;"
src="https://www.google.com/maps?q=Soroksári%20út%2046%20Budapest&output=embed">
</iframe>
</div>
</div>

<footer>
© 2026 Lúa Restaurant
</footer>

<script>
function setLang(lang){
document.querySelectorAll('[data-hu]').forEach(el=>{
el.innerText = el.getAttribute('data-'+lang);
});
}
</script>

</body>
</html>
